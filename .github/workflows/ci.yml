name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:
    inputs:
      revision:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.revision || github.sha }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Lint, unit, server and SQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: node --test scripts/release/*.test.mjs
      - run: node scripts/ci/run.mjs unit
      - run: node scripts/ci/run.mjs sql
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  production:
    name: Production builds and synthetic browser smoke
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_RELEASE_SHA: ${{ inputs.revision || github.sha }}
      RELEASE_BUILD: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/prepare-map-assets.mjs
      - run: node scripts/ci/run.mjs build-public
      - run: node scripts/ci/run.mjs build-admin
      - run: node scripts/ci/verify-standalone.mjs
      - run: node scripts/ci/run.mjs smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: production-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
