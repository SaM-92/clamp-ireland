<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="ClampTracker – Sentinel Wheel">
  <title>ClampTracker – Sentinel Wheel</title>
  <!-- Tire ring (annulus) via even-odd -->
  <path d="M100 22 A78 78 0 1 1 100 178 A78 78 0 1 1 100 22 Z
           M100 52 A48 48 0 1 0 100 148 A48 48 0 1 0 100 52 Z"
        fill="#152438" fill-rule="evenodd"/>
  <!-- Cross spokes -->
  <rect x="94" y="52" width="12" height="96" fill="#152438"/>
  <rect x="52" y="94" width="96" height="12" fill="#152438"/>
  <!-- Hub -->
  <circle cx="100" cy="100" r="13" fill="#152438"/>
  <!-- Clamp beam (accent) — horizontal locking bar across lower half -->
  <rect x="6" y="122" width="156" height="18" rx="5" fill="#0369a1"/>
  <!-- Padlock disc at the right end of the beam -->
  <circle cx="170" cy="131" r="22" fill="#0369a1"/>
  <!-- Keyhole cutout (negative space on the padlock) -->
  <path d="M170 121 a5.5 5.5 0 0 1 3 10 l2.5 11 h-11 l2.5 -11 a5.5 5.5 0 0 1 3 -10 z" fill="#f8fafc"/>
</svg>
